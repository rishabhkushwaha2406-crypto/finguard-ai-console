<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinGuard AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* Layout idea: cinematic ledger. A serif display voice over mono evidence, one cobalt accent, semantic severity colors kept separate. */
:root{
  --bg:#f3f5f9; --bg2:#e9edf4; --surface:#ffffff; --surface2:#f4f6fb; --line:rgba(20,36,70,.11); --line2:rgba(20,36,70,.22);
  --text:#0c1322; --muted:#566178; --faint:#8791a6; --accent:#2a56e8; --accent-ink:#ffffff; --accent-soft:rgba(42,86,232,.10);
  --crit:#d8283f; --warn:#b36a00; --ok:#0a8c68; --orange:#d2570f; --violet:#6f45da;
  --shadow:0 1px 2px rgba(12,19,34,.06),0 12px 32px -12px rgba(12,19,34,.18);
  --display:'Instrument Serif',Georgia,'Times New Roman',serif; --sans:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#06080c; --bg2:#0a0d13; --surface:#0e131b; --surface2:#141b26; --line:rgba(150,180,235,.11); --line2:rgba(150,180,235,.24);
    --text:#e9eef7; --muted:#92a0b8; --faint:#5f6d86; --accent:#86b0ff; --accent-ink:#06101f; --accent-soft:rgba(134,176,255,.12);
    --crit:#ff5c6c; --warn:#ffb454; --ok:#3ccfa3; --orange:#ff8a4c; --violet:#b79cff;
    --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 24px 48px -24px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#06080c; --bg2:#0a0d13; --surface:#0e131b; --surface2:#141b26; --line:rgba(150,180,235,.11); --line2:rgba(150,180,235,.24);
  --text:#e9eef7; --muted:#92a0b8; --faint:#5f6d86; --accent:#86b0ff; --accent-ink:#06101f; --accent-soft:rgba(134,176,255,.12);
  --crit:#ff5c6c; --warn:#ffb454; --ok:#3ccfa3; --orange:#ff8a4c; --violet:#b79cff;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 24px 48px -24px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body,#root{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
h1,h2,h3,h4,p{margin:0;text-wrap:balance}
::selection{background:var(--accent);color:var(--accent-ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.page{height:100%;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}

/* controls */
.btn{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--line2);background:transparent;font-weight:500;font-size:13px;white-space:nowrap;transition:background .15s,border-color .15s,transform .15s}
.btn:hover{background:var(--accent-soft);border-color:var(--accent)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.danger{border-color:var(--crit);color:var(--crit)}
.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:6px}
.btn.lg{height:46px;padding:0 22px;font-size:15px;border-radius:10px}
.btn.ghost{border-color:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.input,.select,.textarea{height:34px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);padding:0 10px;font-size:13px;min-width:0}
.textarea{height:auto;padding:8px 10px;width:100%;resize:vertical}
.input::placeholder{color:var(--faint)}
.input:focus,.select:focus,.textarea:focus{border-color:var(--accent);outline:none}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;padding:2px;gap:2px;background:var(--surface)}
.seg button{border:0;background:transparent;height:28px;padding:0 11px;border-radius:6px;font-size:12px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.switch{width:34px;height:20px;border-radius:20px;border:1px solid var(--line2);background:var(--surface2);position:relative;padding:0;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--faint);transition:transform .15s,background .15s}
.switch[aria-checked="true"]{background:var(--accent-soft);border-color:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(14px);background:var(--accent)}
.range{width:100%;accent-color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;height:20px;padding:0 8px;border-radius:20px;font-size:11px;font-weight:500;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.crit{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,transparent);background:color-mix(in srgb,var(--crit) 10%,transparent)}
.pill.high{color:var(--orange);border-color:color-mix(in srgb,var(--orange) 40%,transparent);background:color-mix(in srgb,var(--orange) 10%,transparent)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.pill.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.pill.info{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent);background:var(--accent-soft)}
.pill.plain::before{display:none}
.tag{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}

/* homepage */
.nav{position:sticky;top:0;z-index:30;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:28px;height:60px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em;font-size:16px;text-decoration:none;border:0;background:none;padding:0}
.brand .mark{width:24px;height:24px}
.nav nav{display:flex;gap:22px;margin-left:12px}
.nav nav a{font-size:13px;color:var(--muted);text-decoration:none}
.nav nav a:hover{color:var(--text)}
.nav .sp{flex:1}
.hero{position:relative;padding:64px 0 0;overflow:hidden}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:24px;align-items:center}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(46px,7.2vw,92px);line-height:.98;letter-spacing:-.025em}
.hero h1 em{font-style:italic;color:var(--accent)}
.hero .lede{font-size:18px;color:var(--muted);max-width:520px;margin-top:24px;line-height:1.55}
.hero .cta{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap}
.hero-net{position:relative;height:560px;margin-right:-40px}
.hero-net canvas{position:absolute;inset:0;width:100%;height:100%}
.callout{position:absolute;font-family:var(--mono);font-size:11px;color:var(--text);background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line2);border-left:2px solid var(--crit);padding:6px 10px;border-radius:4px;pointer-events:none;backdrop-filter:blur(6px)}
.callout b{color:var(--crit);font-weight:500}
.strip{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:56px}
.strip>div{padding:22px 24px;border-left:1px solid var(--line)}
.strip>div:first-child{border-left:0;padding-left:0}
.strip .v{font-family:var(--display);font-size:44px;line-height:1;letter-spacing:-.02em}
.strip .l{font-size:12px;color:var(--muted);margin-top:8px}
.sec{padding:120px 0 0}
.sec h2{font-family:var(--display);font-weight:400;font-size:clamp(34px,4.6vw,58px);line-height:1.03;letter-spacing:-.02em;max-width:760px;margin-top:14px}
.sec h2 em{font-style:italic;color:var(--accent)}
.sec .sub{color:var(--muted);font-size:16px;max-width:560px;margin-top:16px}
.engines{margin-top:48px;border-top:1px solid var(--line)}
.engine{display:grid;grid-template-columns:220px 1fr 220px 120px;gap:24px;align-items:baseline;padding:22px 0;border-bottom:1px solid var(--line);transition:background .2s,padding .2s}
.engine:hover{background:linear-gradient(90deg,var(--accent-soft),transparent);padding-left:12px}
.engine h3{font-family:var(--display);font-weight:400;font-size:28px;letter-spacing:-.01em}
.engine p{color:var(--muted)}
.engine .m{font-family:var(--mono);font-size:12px;color:var(--text)}
.engine .go{justify-self:end;font-size:13px;color:var(--accent);background:none;border:0;padding:0}
.demo{margin-top:40px;display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:0;border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden}
.demo .ctl{padding:24px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px}
.demo .viz{padding:20px 22px;min-width:0}
.result{display:flex;gap:10px;align-items:center;font-size:13px;padding:10px 12px;border:1px solid var(--line2);border-radius:8px}
.chat{display:flex;flex-direction:column;gap:14px}
.bubble{max-width:760px;border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface)}
.bubble.me{align-self:flex-end;background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.bubble p+p,.bubble ul{margin-top:8px}
.bubble ul{padding-left:18px;margin-bottom:0}
.ev{display:inline-flex;font-family:var(--mono);font-size:11px;padding:1px 6px;border:1px solid var(--line2);border-radius:4px;margin:2px 4px 2px 0;color:var(--accent);background:var(--accent-soft);cursor:pointer}
.steps{display:grid;grid-template-columns:260px 1fr;margin-top:40px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface)}
.steps .rail{border-right:1px solid var(--line);padding:10px}
.steps .rail button{display:flex;gap:12px;width:100%;text-align:left;border:0;background:transparent;padding:12px;border-radius:8px;color:var(--muted)}
.steps .rail button[aria-current="true"]{background:var(--accent-soft);color:var(--text)}
.steps .rail .n{font-family:var(--mono);font-size:11px;color:var(--faint);padding-top:2px}
.steps .stage{padding:24px;min-width:0}
.foot{margin-top:140px;border-top:1px solid var(--line);padding:56px 0 40px}
.foot .big{font-family:var(--display);font-size:clamp(36px,5vw,64px);line-height:1;letter-spacing:-.02em}
.foot .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px;margin-top:56px;font-size:13px;color:var(--muted)}
.foot .cols h4{font-size:12px;color:var(--text);margin-bottom:10px;font-weight:500}
.foot .cols a,.foot .cols button{display:block;color:var(--muted);text-decoration:none;margin:6px 0;background:none;border:0;padding:0;text-align:left;font-size:13px}
.foot .cols a:hover,.foot .cols button:hover{color:var(--text)}

/* app shell */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);height:100%}
.side{border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;overflow-y:auto;z-index:20}
.side .top{padding:16px 16px 12px;display:flex;align-items:center;justify-content:space-between}
.side .grp{padding:14px 16px 6px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.side .item{display:flex;align-items:center;gap:11px;margin:1px 8px;padding:8px 10px;border-radius:8px;border:0;background:transparent;color:var(--muted);text-align:left;font-size:13px;width:calc(100% - 16px);position:relative}
.side .item:hover{background:var(--accent-soft);color:var(--text)}
.side .item[aria-current="page"]{background:var(--accent-soft);color:var(--text)}
.side .item[aria-current="page"]::before{content:"";position:absolute;left:-8px;top:8px;bottom:8px;width:2px;background:var(--accent);border-radius:2px}
.side .item .badge{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--muted);border:1px solid var(--line2);border-radius:10px;padding:0 6px}
.side .foot2{margin-top:auto;padding:14px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.mainc{display:flex;flex-direction:column;min-width:0;height:100%}
.topbar{display:flex;align-items:center;gap:12px;height:56px;padding:0 24px;border-bottom:1px solid var(--line);flex:none;background:var(--bg)}
.topbar h1{font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.topbar .sp{flex:1}
.gsearch{position:relative;width:min(340px,38vw)}
.gsearch .input{width:100%;padding-left:32px}
.gsearch svg{position:absolute;left:10px;top:9px;color:var(--faint)}
.sugg{position:absolute;top:40px;left:0;right:0;background:var(--surface);border:1px solid var(--line2);border-radius:10px;box-shadow:var(--shadow);max-height:360px;overflow:auto;z-index:40}
.sugg button{display:flex;gap:10px;width:100%;border:0;background:transparent;text-align:left;padding:8px 12px;font-size:12px;align-items:center}
.sugg button:hover{background:var(--accent-soft)}
.content{flex:1;overflow:auto;padding:24px}
.content>section{max-width:1400px;margin:0 auto}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.hd h2{font-family:var(--display);font-weight:400;font-size:34px;letter-spacing:-.02em;line-height:1.05}
.hd p{color:var(--muted);max-width:640px;margin-top:6px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.kpi{padding:16px 18px;border-left:1px solid var(--line);min-width:0}
.kpi:first-child{border-left:0}
.kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.kpi .v{font-family:var(--display);font-size:34px;line-height:1.1;letter-spacing:-.02em;margin-top:6px}
.kpi .s{font-size:11px;color:var(--faint);margin-top:2px}
.grid{display:grid;gap:16px;margin-top:16px}
.g2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.panel{border:1px solid var(--line);border-radius:12px;background:var(--surface);min-width:0}
.panel>header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line)}
.panel>header h3{font-size:13px;font-weight:600}
.panel>header small{color:var(--faint);font-size:11px}
.panel .body{padding:16px}
.panel .body.flush{padding:0}
.tw{overflow:auto;max-width:100%}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{position:sticky;top:0;background:var(--surface);text-align:left;font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:9px 14px;border-bottom:1px solid var(--line2);white-space:nowrap;user-select:none}
.tbl th.s{cursor:pointer}
.tbl th.s:hover{color:var(--text)}
.tbl td{padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.tbl tr.r{cursor:pointer;transition:background .12s}
.tbl tr.r:hover td{background:var(--accent-soft)}
.tbl tr.r td:first-child{box-shadow:inset 3px 0 0 var(--stripe,transparent)}
.tbl .right{text-align:right}
.pager{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;font-size:12px;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.drawer-bg{position:fixed;inset:0;background:rgba(2,5,10,.5);z-index:60;animation:fade .2s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--bg2);border-left:1px solid var(--line2);z-index:61;display:flex;flex-direction:column;animation:slide .24s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow)}
.drawer>header{display:flex;justify-content:space-between;align-items:flex-start;padding:18px 20px;border-bottom:1px solid var(--line);gap:12px}
.drawer>.dbody{padding:20px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:18px}
.drawer>footer{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 12px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.sect-t{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.evl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.evl li{padding:8px 10px;border:1px solid var(--line);border-left:2px solid var(--accent);border-radius:6px;font-size:13px;background:var(--surface)}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:1px solid var(--line2);display:flex;flex-direction:column;gap:14px}
.tl li{position:relative;font-size:13px}
.tl li::before{content:"";position:absolute;left:-18px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.tl small{display:block;color:var(--faint);font-family:var(--mono);font-size:11px}
.bar{height:6px;border-radius:6px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:var(--accent)}
.rowbar{display:grid;grid-template-columns:150px 1fr 56px;gap:10px;align-items:center;font-size:12px;margin:7px 0}
.split{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:16px;height:calc(100% - 0px)}
.list{display:flex;flex-direction:column;overflow:auto;max-height:calc(100vh - 220px)}
.list button{display:flex;gap:12px;align-items:center;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:10px 14px}
.list button:hover{background:var(--accent-soft)}
.list button[aria-current="true"]{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow:auto}
.col{border:1px solid var(--line);border-radius:12px;background:var(--surface);min-height:260px}
.col>h4{padding:12px 14px;border-bottom:1px solid var(--line);font-size:12px;font-weight:600;display:flex;justify-content:space-between}
.cardx{margin:10px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--bg2);cursor:pointer;transition:border-color .15s,transform .15s}
.cardx:hover{border-color:var(--accent);transform:translateY(-1px)}
.chatbox{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px}
.msgs{display:flex;flex-direction:column;gap:12px;padding:18px;overflow:auto;height:calc(100vh - 330px);min-height:320px}
.compose{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
.notice{font-size:12px;color:var(--muted);border:1px solid var(--line);border-left:2px solid var(--warn);padding:8px 12px;border-radius:6px;background:var(--surface)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13px;z-index:80;animation:fade .2s;box-shadow:var(--shadow)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px}
.menu-btn{display:none}
.gwrap{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg2)}
.gwrap canvas{display:block;width:100%;touch-action:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}

.vrow:hover{background:var(--accent-soft)}

.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--text)}
.prog{height:6px;border-radius:6px;background:var(--surface2);overflow:hidden}.prog>i{display:block;height:100%;background:var(--accent);transition:width .2s}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.page{scroll-behavior:auto}}
@media (max-width:1100px){

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>

<script>
'use strict';
/* ============================================================
   FinGuard AI  ·  client-side engine (synthetic data, no backend)
   Everything below is deterministic and computed in the browser.
   The `api` object at the bottom is the seam for a FastAPI backend.
   ============================================================ */
const H = 3600e3, D = 86400e3, IST = 5.5 * H;
const BASE = Date.UTC(2026, 10, 11, 5, 30);           // "now" = 11 Nov 2026, 11:00 IST
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const pad = n => String(n).padStart(2, '0');
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const sumAmt = l => l.reduce((s, t) => s + t.amt, 0);
const fmtTs = ts => { const d = new Date(ts + IST); return `${pad(d.getUTCDate())} ${MON[d.getUTCMonth()]} ${pad(d.getUTCHours())}:${pad(d.getUTCMinutes())}`; };
const fmtDay = ts => { const d = new Date(ts + IST); return `${pad(d.getUTCDate())} ${MON[d.getUTCMonth()]}`; };
const hourIST = ts => new Date(ts + IST).getUTCHours();
const dowIST = ts => new Date(ts + IST).getUTCDay();
const dayKey = ts => Math.floor((ts + IST) / D);
const fmtINR = n => { const a = Math.abs(n); let s; if (a >= 1e7) s = (a / 1e7).toFixed(2) + ' Cr'; else if (a >= 1e5) s = (a / 1e5).toFixed(2) + ' L'; else s = Math.round(a).toLocaleString('en-IN'); return (n < 0 ? '-' : '') + '₹' + s; };
const fmtFull = n => '₹' + Math.round(n).toLocaleString('en-IN');
const pct = (v, d = 0) => (v * 100).toFixed(d) + '%';
const sigmoid = z => 1 / (1 + Math.exp(-z));
const SEV_ORDER = { Critical: 4, High: 3, Medium: 2, Low: 1 };
const CPRISK = { IN: .08, US: .12, GB: .12, SG: .15, AE: .35, TR: .45, HK: .4, CY: .6, SC: .7, KY: .75, PA: .8 };

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

/* ---------- synthetic dataset ---------- */
function buildDataset() {
  const rnd = mulberry32(7311);
  const R = (a, b) => a + (b - a) * rnd(), RI = (a, b) => Math.floor(R(a, b + 1)), pick = a => a[Math.floor(rnd() * a.length)];
  const FIRST = ['Aarav','Ishita','Rohan','Meera','Kabir','Ananya','Vihaan','Diya','Arjun','Sana','Neel','Tara','Yash','Riya','Dev','Naina','Karan','Pooja','Aditya','Sneha','Rahul','Kavya','Manish','Leena','Farhan','Isha','Varun','Anjali'];
  const LAST = ['Sharma','Iyer','Kulkarni','Menon','Patel','Reddy','Chatterjee','Nair','Gupta','Khan','Bose','Joshi','Rao','Mehta','Sinha','Desai','Pillai','Kapoor','Shetty','Verma','Das','Singh','Malhotra','Bhatt','Ghosh'];
  const OCC = [['Salaried employee', .1], ['Software engineer', .08], ['Physician', .12], ['Jeweller', .7], ['Real-estate broker', .65], ['Forex dealer', .78], ['Student', .2], ['Restaurant owner', .5], ['Commodity trader', .58], ['Management consultant', .3], ['School teacher', .08], ['Import-export trader', .62], ['Chartered accountant', .2], ['Logistics operator', .4]];
  const CITY = ['Mumbai','Pune','Bengaluru','Delhi','Hyderabad','Chennai','Kolkata','Ahmedabad','Jaipur','Kochi'];
  const OV = {
    7: { occ: 'Jeweller', base: 820000, seg: 'SME', kyc: 'Verified' }, 12: { occ: 'Software engineer', base: 90000, seg: 'Retail', kyc: 'Verified' },
    19: { occ: 'Import-export trader', base: 700000, seg: 'SME', kyc: 'Pending' }, 23: { occ: 'Real-estate broker', base: 300000, seg: 'Retail', kyc: 'Expired', dormant: 240 },
    31: { occ: 'Commodity trader', base: 520000 }, 34: { occ: 'Restaurant owner', base: 480000 }, 38: { occ: 'Logistics operator', base: 560000 },
    41: { occ: 'Student', base: 40000, seg: 'Retail', kyc: 'Pending' }, 42: { occ: 'Salaried employee', base: 55000, kyc: 'Expired' }, 43: { occ: 'Salaried employee', base: 52000 }, 44: { occ: 'Forex dealer', base: 150000 },
    46: { occ: 'Management consultant', base: 260000 }, 50: { occ: 'Import-export trader', base: 800000, seg: 'SME' }, 58: { occ: 'School teacher', base: 45000, dormant: 210 }, 15: { occ: 'Chartered accountant', base: 240000 }, 27: { occ: 'Physician', base: 300000 }, 36: { occ: 'School teacher', base: 60000 }
  };
  const customers = [];
  for (let i = 1; i <= 60; i++) {
    const o = OV[i] || {}, occ = o.occ ? OCC.find(x => x[0] === o.occ) : pick(OCC);
    const base = o.base || Math.round(Math.exp(R(Math.log(40000), Math.log(700000))) / 1000) * 1000;
    const kycRoll = rnd();
    customers.push({
      id: 'C-' + (1000 + i), name: FIRST[(i * 3) % FIRST.length] + ' ' + LAST[(i * 7 + 3) % LAST.length], occ: occ[0], occRisk: occ[1],
      city: pick(CITY), country: i % 17 === 0 ? 'AE' : 'IN', geo: i % 17 === 0 ? .4 : R(.04, .2),
      kyc: o.kyc || (kycRoll < .82 ? 'Verified' : kycRoll < .92 ? 'Pending' : 'Expired'), seg: o.seg || (base > 400000 ? 'SME' : base > 200000 ? 'HNI' : 'Retail'),
      since: 2014 + (i % 11), base, dev: 'D-' + (2000 + i), dormantDays: o.dormant || 0, idx: i
    });
  }
  const cid = n => 'C-' + (1000 + n);
  const MERCH = ['Aurora Electronics','Metro Fuel','Saffron Table','Urban Grocer','Lumen Cabs','StreamBox','Kite Pharmacy','Harbor Books','Nimbus Airlines','Zen Fitness','Orchid Salon','Pixel Mobiles'];
  const BEN = ['Sunrise Traders','Bluepeak Logistics','K. Narayan & Co','Maple Interiors','Vertex Components','Ganga Textiles','Delta Mobility','Orion Packaging','Sahyadri Foods','Pinnacle Realty'];
  const FOREIGN = [['AE', 'Falcon Gate Trading'], ['SG', 'Merlion Supply Pte'], ['GB', 'Thames Ledger Ltd'], ['HK', 'Pearl Delta Co'], ['CY', 'Aegean Holdings'], ['PA', 'Meridian Holdings'], ['TR', 'Bosphorus Exports']];
  const raw = []; let uid = 0;
  const mkTx = (c, hoursAgo, dir, type, amt, cp, o = {}) => raw.push({ _u: uid++, c, ts: Math.round(BASE - hoursAgo * H), dir, type, amt: Math.round(amt), cp: cp.id, cpName: cp.name, cpC: cp.c || 'IN', ch: o.ch || (type === 'CASH_DEP' ? 'Branch' : type === 'CARD' ? 'POS' : pick(['Mobile', 'Mobile', 'Web', 'API'])), dev: o.dev || null, st: 'Completed', fraud: o.fraud || null });
  const merch = () => { const n = pick(MERCH); return { id: 'M-' + (3000 + MERCH.indexOf(n)), name: n }; };
  const ben = (k, idx = 0) => ({ id: 'B-' + (1100 + idx * 10 + (k % 10)), name: BEN[(k + idx) % BEN.length] });
  const fben = (k, idx = 0) => { const f = FOREIGN[k % FOREIGN.length]; return { id: 'B-' + (7000 + idx * 10 + (k % FOREIGN.length)), name: f[1], c: f[0] }; };
  const T = (a, b, hoursAgo, type, amt, o = {}) => { // both sides of a customer-to-customer transfer (a, b are customer numbers)
    const A = cid(a), B = cid(b);
    mkTx(A, hoursAgo, 'out', type, amt, { id: B, name: customers[b - 1].name }, { dev: o.dev, fraud: o.fraud, ch: o.ch });
    mkTx(B, hoursAgo - .01, 'in', type, amt, { id: A, name: customers[a - 1].name });
  };
  const skip = new Set([7, 12, 19, 23, 31, 34, 38, 41, 42, 43, 44, 46, 50, 58, 15, 27, 36]);

  // baseline behaviour
  customers.forEach(c => {
    if (c.dormantDays || skip.has(c.idx) && ![15, 27, 36].includes(c.idx)) return;
    const typ = c.base / 9, n = RI(5, 12), pool = [RI(0, 9), RI(0, 9), RI(0, 9), RI(0, 9)];
    const when = () => { const day = RI(0, 29), hr = rnd() < .93 ? RI(8, 22) : RI(0, 7); const d0 = Math.floor((BASE + IST) / D) * D - IST; let ts = d0 - day * D + hr * H + RI(0, 59) * 60000; if (ts > BASE - 600000) ts -= D; return (BASE - ts) / H; };
    if (rnd() < .72) mkTx(c.id, when(), 'in', 'NEFT', c.base * R(1, 1.25), { id: 'E-' + (500 + c.idx % 7), name: 'Employer / client payout' }, { ch: 'API' });
    for (let k = 0; k < n; k++) {
      const r = rnd();
      if (r < .36) mkTx(c.id, when(), 'out', 'UPI', clamp(typ * R(.03, .4), 120, 80000), merch());
      else if (r < .52) mkTx(c.id, when(), 'out', 'CARD', clamp(typ * R(.05, .7), 200, 90000), merch());
      else if (r < .68) mkTx(c.id, when(), 'out', 'IMPS', clamp(typ * R(.2, 1.1), 1500, 140000), ben(pick(pool), c.idx));
      else if (r < .8) mkTx(c.id, when(), 'out', 'NEFT', typ * R(.5, 1.8), ben(pick(pool), c.idx));
      else if (r < .86) mkTx(c.id, when(), 'in', 'CASH_DEP', clamp(typ * R(.2, 1.2), 3000, 280000), { id: 'BR-' + RI(1, 9), name: 'Branch cash counter' });
      else if (r < .91 && c.seg !== 'Retail') mkTx(c.id, when(), 'out', 'WIRE', typ * R(1, 2.6), fben(pick([0, 1, 2, 2]), c.idx));
      else { const peer = 1 + ((c.idx + RI(1, 58)) % 60); if (rnd() < .22 && peer !== c.idx && !skip.has(peer)) T(c.idx, peer, when(), 'UPI', clamp(typ * R(.04, .25), 300, 60000)); else mkTx(c.id, when(), 'out', 'UPI', typ * .1, merch()); }
    }
  });

  // S1 structuring
  [[118, 9.42], [96, 9.67], [70, 9.31], [52, 9.85], [30, 9.58]].forEach(([h, a], i) => mkTx(cid(7), h, 'in', 'CASH_DEP', a * 1e5, { id: 'BR-' + (2 + i % 3), name: 'Branch cash counter' }, { ch: 'Branch' }));
  for (let k = 0; k < 6; k++) mkTx(cid(7), RI(3, 600) / 20, 'out', 'UPI', RI(900, 9000), merch());
  // S2 velocity
  for (let k = 0; k < 19; k++) mkTx(cid(12), 40 - k * .33, 'out', k % 3 ? 'UPI' : 'IMPS', RI(1200, 19000), k % 3 ? merch() : ben(k, 12), { ch: 'Mobile' });
  mkTx(cid(12), 120, 'in', 'NEFT', 90000, { id: 'E-501', name: 'Employer / client payout' }, { ch: 'API' });
  // S3 rapid movement
  mkTx(cid(19), 60, 'in', 'WIRE', 18.5e5 * 1, { id: 'B-7000', name: 'Falcon Gate Trading', c: 'AE' }, { ch: 'API' });
  [[58.4, 6.1, 3], [57.3, 6.0, 4], [56.2, 5.9, 5]].forEach(([h, a, k]) => mkTx(cid(19), h, 'out', 'WIRE', a * 1e5, fben(k, 19), { ch: 'Web' }));
  mkTx(cid(19), 200, 'in', 'NEFT', 120000, { id: 'E-502', name: 'Employer / client payout' }, { ch: 'API' });
  // S4 dormant
  mkTx(cid(23), 30, 'in', 'WIRE', 7.8e5, { id: 'B-7001', name: 'Merlion Supply Pte', c: 'SG' }, { ch: 'API' });
  mkTx(cid(23), 26, 'out', 'NEFT', 7.7e5, ben(8, 23), { ch: 'Web' });
  mkTx(cid(58), 10, 'out', 'UPI', 12000, merch());
  // S5 circular transfers
  T(31, 34, 90, 'NEFT', 6.5e5); T(34, 38, 71, 'NEFT', 6.42e5); T(38, 31, 48, 'NEFT', 6.3e5);
  // S6/S9 mule collection and shared beneficiary
  const senders = [1, 2, 3, 4, 5, 6, 8, 9, 10, 11, 13, 14, 16, 17, 18, 20];
  senders.forEach((s, k) => T(s, 41, 120 - k * 5.3, k % 2 ? 'UPI' : 'IMPS', RI(8, 38) * 1000, { fraud: k % 4 === 1 ? 'Authorized push payment scam' : null, ch: 'Mobile' }));
  for (let k = 0; k < 8; k++) mkTx(cid(41), 110 - k * 11, 'in', 'IMPS', RI(9, 35) * 1000, { id: 'S-' + (60 + k), name: 'External sender ' + (60 + k) }, { ch: 'API' });
  mkTx(cid(41), 9, 'out', 'NEFT', 5.4e5, { id: 'B-9001', name: 'Nexus Trade Solutions' }, { ch: 'Mobile', dev: 'D-0888' });
  [42, 43, 44].forEach((n, i) => {
    for (let k = 0; k < 5; k++) mkTx(cid(n), 70 - k * 9 - i * 2, 'in', 'IMPS', RI(12, 40) * 1000, { id: 'S-' + (80 + i * 5 + k), name: 'External sender ' + (80 + i * 5 + k) }, { ch: 'API' });
    mkTx(cid(n), 20 - i * 3, 'out', 'NEFT', (2.0 + i * .4) * 1e5, { id: 'B-9001', name: 'Nexus Trade Solutions' }, { ch: 'Mobile', dev: n === 44 ? 'D-0888' : 'D-0777' });
    mkTx(cid(n), 40 - i, 'out', 'UPI', 2400, merch(), { dev: n === 44 ? 'D-0888' : 'D-0777' });
  });
  // S7 unusual volume
  for (let k = 0; k < 9; k++) mkTx(cid(50), 120 - k * 12, 'out', k % 2 ? 'NEFT' : 'IMPS', RI(52, 90) * 1e4, ben(k + 2, 50), { ch: 'Web' });
  mkTx(cid(50), 280, 'in', 'CASH_DEP', 140000, { id: 'BR-3', name: 'Branch cash counter' });
  // S8 repeated beneficiary
  for (let k = 0; k < 7; k++) mkTx(cid(46), 70 - k * 10, 'out', 'IMPS', 49000, { id: 'B-9100', name: 'Kestrel Consulting' }, { ch: 'Mobile' });
  mkTx(cid(46), 300, 'in', 'NEFT', 260000, { id: 'E-503', name: 'Employer / client payout' });
  // fraud: account takeover, card-not-present, push-payment scam
  mkTx(cid(15), 19.8, 'out', 'WIRE', 9.4e5, fben(5, 15), { ch: 'Web', dev: 'D-9120', fraud: 'Account takeover' });
  mkTx(cid(15), 21.5, 'out', 'UPI', 85000, ben(3, 15), { ch: 'Mobile', dev: 'D-9120', fraud: 'Account takeover' });
  mkTx(cid(15), 200, 'in', 'NEFT', 240000, { id: 'E-504', name: 'Employer / client payout' });
  mkTx(cid(27), 33, 'out', 'CARD', 38000, { id: 'M-3900', name: 'Orbit Gadgets (overseas)', c: 'HK' }, { ch: 'Online', fraud: 'Card-not-present' });
  mkTx(cid(27), 32.8, 'out', 'CARD', 61500, { id: 'M-3901', name: 'LuxeStreet Online', c: 'CY' }, { ch: 'Online', fraud: 'Card-not-present' });
  mkTx(cid(27), 32.6, 'out', 'CARD', 52000, { id: 'M-3902', name: 'Nova Digital', c: 'HK' }, { ch: 'Online', fraud: 'Card-not-present' });
  mkTx(cid(27), 150, 'in', 'NEFT', 300000, { id: 'E-505', name: 'Employer / client payout' });
  mkTx(cid(36), 14, 'out', 'IMPS', 240000, { id: 'B-8801', name: 'Quick Prize Desk' }, { ch: 'Mobile', fraud: 'Authorized push payment scam' });
  mkTx(cid(36), 190, 'in', 'NEFT', 60000, { id: 'E-506', name: 'Employer / client payout' });
  // random account-takeover style fraud in baseline outbound transactions
  const cands = raw.filter(t => t.dir === 'out' && !t.fraud && (t.type === 'WIRE' || t.type === 'IMPS' || t.type === 'UPI' || t.type === 'CARD') && !skip.has(+t.c.slice(2) - 1000)).sort(() => rnd() - .5).slice(0, 11);
  cands.forEach((t, k) => {
    const sig = () => rnd() < .78;
    t.fraud = k % 3 === 0 ? 'Synthetic identity' : k % 3 === 1 ? 'Account takeover' : 'Card-not-present';
    if (sig()) t.dev = 'D-9' + (200 + k);
    if (sig()) { const d0 = Math.floor((t.ts + IST) / D) * D - IST; t.ts = d0 + RI(0, 4) * H + RI(2, 55) * 60000; if (t.ts > BASE) t.ts -= D; }
    const cu = customers[+t.c.slice(2) - 1001]; if (sig()) t.amt = Math.round(clamp(t.amt * R(4, 11), 20000, cu.base * 2.2));
    if (sig()) { const f = fben(k + 1); t.cp = 'B-8' + (200 + k); t.cpName = f[1] + ' (new)'; t.cpC = f.c; }
  });
  raw.forEach(t => { if (rnd() < .012 && !t.fraud) t.st = 'Failed'; });
  raw.sort((a, b) => a.ts - b.ts || a._u - b._u);
  raw.forEach((t, i) => { t.id = 'TX-' + (480100 + i); });
  return { customers, raw };
}

/* ---------- feature engineering + simulated fraud scorer ---------- */
const FW = { amt: 2.8, newBen: .7, night: 1.4, newDev: 2.6, geo: 2.0, vel: 1.5, xb: .6, typ: 1.0 };
const FB = -5.3;
const FLABEL = { amt: 'Amount vs customer norm', newBen: 'First payment to this beneficiary', night: 'Night-time activity (00:00–05:00 IST)', newDev: 'Unrecognised device', geo: 'Counterparty geography (simulated risk)', vel: 'Transactions in the previous hour', xb: 'Cross-border', typ: 'Payment type risk' };
const TYPE_RISK = { WIRE: .5, CARD: .35, IMPS: .3, NEFT: .15, UPI: .15, CASH_DEP: .2 };
function enrich(raw, customers) {
  const cm = {}; customers.forEach(c => cm[c.id] = c);
  const sorted = [...raw].sort((a, b) => a.ts - b.ts || a._u - b._u), hist = {}, seen = new Set();
  const out = sorted.map(t => {
    const c = cm[t.c], key = t.c + '|' + t.cp, newBen = t.dir === 'out' && !seen.has(key) ? 1 : 0; seen.add(key);
    const arr = hist[t.c] || (hist[t.c] = []); const vel = arr.filter(x => t.ts - x <= H && t.ts >= x).length; arr.push(t.ts);
    const hr = hourIST(t.ts), typical = c.base / 9;
    const feat = { amt: t.dir === 'out' ? clamp(Math.log(Math.max(t.amt / typical, 1)) / 3, 0, 1.5) : 0, newBen, night: hr >= 0 && hr < 5 ? 1 : 0, newDev: t.dev && t.dev !== c.dev && /^D-9/.test(t.dev) ? 1 : 0, geo: CPRISK[t.cpC] ?? .3, vel: clamp(vel / 6), xb: t.cpC !== 'IN' ? 1 : 0, typ: TYPE_RISK[t.type] ?? .2 };
    return { ...t, feat };
  });
  const mean = {}; Object.keys(FW).forEach(k => mean[k] = out.reduce((s, t) => s + t.feat[k], 0) / Math.max(out.length, 1));
  out.forEach(t => { let z = FB; Object.keys(FW).forEach(k => z += FW[k] * t.feat[k]); t.z = z; t.p = sigmoid(z); if (t.st === 'Completed' && t.p >= .85) t.st = 'Held'; });
  return { txns: out, mean };
}

function HeroNet({ loop }) {
  const ref = useRef(null);
  useEffect(() => {
    const cv = ref.current; if (!cv || !cv.getContext) return; const ctx = cv.getContext('2d'); if (!ctx) return;
    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    const rnd = mulberry32(99), N = 74, nodes = [], dpr = Math.min(2, window.devicePixelRatio || 1);
    for (let i = 0; i < N; i++) nodes.push({ x: .08 + .92 * rnd(), y: rnd(), vx: (rnd() - .5) * .00016, vy: (rnd() - .5) * .00016, r: 1.4 + rnd() * 2.2, ph: rnd() * 6.28 });
    const cyc = [{ x: .62, y: .36 }, { x: .82, y: .58 }, { x: .5, y: .7 }];
    let W = 0, Hh = 0, mouse = null, raf = 0, frame = 0, col = {};
    const readCols = () => { const s = getComputedStyle(document.documentElement); col = { line: s.getPropertyValue('--line2').trim(), acc: s.getPropertyValue('--accent').trim(), crit: s.getPropertyValue('--crit').trim(), faint: s.getPropertyValue('--faint').trim(), text: s.getPropertyValue('--text').trim() }; };
    const size = () => { W = cv.clientWidth; Hh = cv.clientHeight; cv.width = W * dpr; cv.height = Hh * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
    size(); readCols();
    const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(size) : null; ro && ro.observe(cv);
    const mv = e => { const r = cv.getBoundingClientRect(); mouse = { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height }; };
    cv.addEventListener('pointermove', mv); cv.addEventListener('pointerleave', () => mouse = null);
    const pulses = []; for (let i = 0; i < 16; i++) pulses.push({ a: Math.floor(rnd() * N), t: rnd(), s: .002 + rnd() * .004, b: -1 });
    const draw = (time) => {
      frame++; if (frame % 90 === 0) readCols();
      ctx.clearRect(0, 0, W, Hh);
      const P = (n) => [n.x * W, n.y * Hh];
      nodes.forEach(n => { if (!reduce) { n.x += n.vx * 16; n.y += n.vy * 16; if (n.x < .05 || n.x > 1) n.vx *= -1; if (n.y < 0 || n.y > 1) n.vy *= -1; } });
      const near = (a, b) => Math.hypot((a.x - b.x) * W, (a.y - b.y) * Hh);
      const edges = [];
      for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) { const d = near(nodes[i], nodes[j]); if (d < 118) edges.push([i, j, d]); }
      ctx.lineWidth = 1;
      edges.forEach(([i, j, d]) => { const a = nodes[i], b = nodes[j]; let hot = 0; if (mouse) { const dm = Math.min(Math.hypot((a.x - mouse.x) * W, (a.y - mouse.y) * Hh), Math.hypot((b.x - mouse.x) * W, (b.y - mouse.y) * Hh)); hot = Math.max(0, 1 - dm / 150); } ctx.globalAlpha = (1 - d / 118) * .5 + hot * .6; ctx.strokeStyle = hot > .2 ? col.acc : col.line; ctx.beginPath(); ctx.moveTo(...P(a)); ctx.lineTo(...P(b)); ctx.stroke(); });
      nodes.forEach(n => { const [x, y] = P(n); let hot = 0; if (mouse) hot = Math.max(0, 1 - Math.hypot(x - mouse.x * W, y - mouse.y * Hh) / 120); ctx.globalAlpha = .55 + hot * .45; ctx.fillStyle = hot > .3 ? col.acc : col.faint; ctx.beginPath(); ctx.arc(x, y, n.r + hot * 2, 0, 6.283); ctx.fill(); });
      pulses.forEach(p => { if (p.b < 0 || p.t >= 1) { p.a = Math.floor(rnd() * N); const cand = edges.filter(e => e[0] === p.a || e[1] === p.a); if (cand.length) { const e = cand[Math.floor(rnd() * cand.length)]; p.from = e[0] === p.a ? e[0] : e[1]; p.b = e[0] === p.a ? e[1] : e[0]; } else p.b = -1; p.t = 0; } if (p.b >= 0) { p.t += reduce ? 0 : p.s * 1.6; const a = nodes[p.from], b = nodes[p.b], x = (a.x + (b.x - a.x) * p.t) * W, y = (a.y + (b.y - a.y) * p.t) * Hh; ctx.globalAlpha = .9; ctx.fillStyle = col.acc; ctx.beginPath(); ctx.arc(x, y, 1.8, 0, 6.283); ctx.fill(); } });
      // the loop
      const tt = reduce ? 0 : time / 1000;
      ctx.globalAlpha = 1; ctx.strokeStyle = col.crit; ctx.lineWidth = 1.6;
      cyc.forEach((c, i) => { const d = cyc[(i + 1) % 3], ax = c.x * W, ay = c.y * Hh, bx = d.x * W, by = d.y * Hh; ctx.setLineDash([6, 6]); ctx.lineDashOffset = -tt * 22; ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke(); ctx.setLineDash([]); const k = (tt * .35 + i / 3) % 1, px = ax + (bx - ax) * k, py = ay + (by - ay) * k; ctx.fillStyle = col.crit; ctx.beginPath(); ctx.arc(px, py, 3.2, 0, 6.283); ctx.fill(); });
      cyc.forEach((c, i) => { const x = c.x * W, y = c.y * Hh, pr = (tt * .6 + i * .33) % 1; ctx.globalAlpha = (1 - pr) * .5; ctx.beginPath(); ctx.arc(x, y, 8 + pr * 22, 0, 6.283); ctx.stroke(); ctx.globalAlpha = 1; ctx.fillStyle = col.crit; ctx.beginPath(); ctx.arc(x, y, 5.5, 0, 6.283); ctx.fill(); });
      ctx.globalAlpha = 1;
      if (!reduce) raf = requestAnimationFrame(draw);
    };
    raf = requestAnimationFrame(draw);
    return () => { cancelAnimationFrame(raf); ro && ro.disconnect(); cv.removeEventListener('pointermove', mv); };
  }, []);
  return html`<div className="hero-net"><canvas ref=${ref} aria-label="Animated financial network with a circular transfer highlighted"></canvas>
    <div className="callout" style=${{ left: '40%', top: '16%' }}><b>AML-005</b> circular transfer<br/>${loop}</div>
    <div className="callout" style=${{ left: '60%', top: '82%', borderLeftColor: 'var(--accent)' }}><b style=${{ color: 'var(--accent)' }}>Graph</b> 3 customers, one loop<br/>evidence attached to the case</div></div>`;
}

  const sugg = useMemo(() => { const t = gq.trim().toLowerCase(); if (t.length < 2) return []; const out = []; customers.forEach(c => { if ((c.id + ' ' + c.name).toLowerCase().includes(t)) out.push({ k: 'customer', id: c.id, l: c.name, s: c.id + ' · customer' }); }); alerts.forEach(a => { if (a.id.toLowerCase().includes(t)) out.push({ k: 'alert', id: a.id, l: a.title, s: a.id + ' · alert' }); }); txns.forEach(x => { if (out.length < 14 && x.id.toLowerCase().includes(t)) out.push({ k: 'txn', id: x.id, l: `${x.type} ${fmtINR(x.amt)}`, s: x.id + ' · transaction' }); }); return out.slice(0, 10); }, [gq, alerts, txns]);

  const View = PAGE_VIEW[route], pg = PAGES.find(p => p[0] === route);
  const badge = id => id === 'aml' ? alerts.filter(a => a.kind === 'AML').length : id === 'fraud' ? alerts.filter(a => a.kind === 'Fraud').length : id === 'cases' ? cases.filter(c => c.status !== 'Closed').length : null;
  const detailEl = detail && (detail.type === 'txn' ? html`<${TxnDrawer} id=${detail.id}/>` : detail.type === 'alert' ? html`<${AlertDrawer} id=${detail.id}/>` : detail.type === 'case' ? html`<${CaseDrawer} id=${detail.id}/>` : detail.type === 'btx' ? html`<${BenchTxnDrawer} id=${detail.id}/>` : null);
  const toastEl = toastMsg && html`<div className="toast" role="status">${toastMsg}</div>`;
  if (route === 'home') return html`<${AppCtx.Provider} value=${app}><${Home}/>${detailEl}${toastEl}<//>`;
  let lastGrp = '';
  return html`<${AppCtx.Provider} value=${app}><div className="shell"><aside className=${cx('side', menu && 'open')} aria-label="Primary"><div className="top"><button className="brand" onClick=${() => go('home')}><${Logo}/>FinGuard AI</button></div>
      ${PAGES.map(([id, label, ic, grp]) => { const head = grp !== lastGrp ? html`<div className="grp" key=${'g' + grp}>${grp}</div>` : null; lastGrp = grp; const b = badge(id); return html`<${Fragment} key=${id}>${head}<button className="item" aria-current=${route === id ? 'page' : undefined} onClick=${() => go(id)}><${Icon} n=${ic}/>${label}${b != null && html`<span className="badge">${b}</span>`}</button><//>`; })}
      <div className="foot2"><div style=${{ display: 'flex', gap: 8, alignItems: 'center', marginBottom: 8 }}><${Pill} tone=${live ? 'ok' : ''}>${live ? 'Simulation running' : 'Simulation idle'}<//></div>Synthetic demo data. Logic runs in your browser.<div style=${{ marginTop: 10 }}><${Btn} sm kind="ghost" icon="home" onClick=${() => go('home')}>Back to website<//></div></div></aside>
    <div className="mainc"><div className="topbar"><button className="btn ghost sm menu-btn" aria-label="Open navigation" onClick=${() => setMenu(m => !m)}><${Icon} n="menu"/></button><h1>${pg[1]}</h1><div className="sp"></div>
      <div className="gsearch"><${Icon} n="search" s=${15}/><input className="input" placeholder="Search customers, alerts, transactions" value=${gq} onChange=${e => setGq(e.target.value)} aria-label="Global search"/>${sugg.length > 0 && html`<div className="sugg">${sugg.map(s => html`<button key=${s.k + s.id} onClick=${() => { setGq(''); open(s.k, s.id); }}><span className="tag">${s.k}</span><span style=${{ flex: 1 }}>${s.l}</span><span className="faint mono" style=${{ fontSize: 11 }}>${s.s}</span></button>`)}</div>`}</div>
      <${Pill} tone="warn" plain>Synthetic data<//><${Btn} kind="ghost sm" icon=${theme === 'dark' ? 'sun' : 'moon'} onClick=${() => setThemeS(theme === 'dark' ? 'light' : 'dark')} aria-label="Switch theme"/></div>
      <main className="content" ref=${contentRef}><${View}/></main></div></div>${detailEl}${toastEl}<//>`;
}
if (!document.documentElement.dataset.theme) document.documentElement.dataset.theme = 'dark';
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script></body></html>
